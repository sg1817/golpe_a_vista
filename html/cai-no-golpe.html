  <div class="principal">
    <h2>Caí no golpe, e agora?</h2>
    <p>Siga os passos na ordem e vá marcando o que já fez.</p>

    <progress id="barra" value="0" max="5"></progress>
    <p id="texto-progresso">0 de 5 passos completados</p>

    <form>
      <p><label><input type="checkbox" id="passo1" onchange="contarPassos()"> 1. Avisei meu banco pelo número oficial</label></p>
      <p><label><input type="checkbox" id="passo2" onchange="contarPassos()"> 2. Troquei as senhas das contas</label></p>
      <p><label><input type="checkbox" id="passo3" onchange="contarPassos()"> 3. Guardei prints e comprovantes</label></p>
      <p><label><input type="checkbox" id="passo4" onchange="contarPassos()"> 4. Registrei um boletim de ocorrência</label></p>
      <p><label><input type="checkbox" id="passo5" onchange="contarPassos()"> 5. Avisei meus contatos (se foi WhatsApp clonado)</label></p>
    </form>
  </div>

  <div class="rodape">
    <p>Projeto da disciplina de Front-end. As mensagens de exemplo são fictícias.</p>
  </div>
