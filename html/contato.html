<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contato - Golpe à Vista</title>
  <link rel="stylesheet" href="../CSS/style.css">
</head>
<body>

  <div class="cabecalho">
    <h1>Golpe à Vista</h1>
    <div class="menu">
      <a href="main.html">Início</a>
      <a href="tipos.html">Tipos de golpe</a>
      <a href="treino.html">Treino</a>
      <a href="cai-no-golpe.html">Caí no golpe</a>
      <a href="glossario.html">Glossário</a>
      <a href="contato.html">Contato</a>
    </div>

    <button onclick="aumentar()">A+</button>
    <button onclick="diminuir()">A-</button>
  </div>

  <div class="principal">
    <h2>Contato</h2>
    <p>Quer sugerir um golpe para a lista? Escreva aqui.</p>

    <!-- onsubmit chama a função validar(). Se ela devolver false, o envio é cancelado. -->

    <form onsubmit="return validar()">
      <p>
        <label for="nome">Nome:</label><br>
        <input type="text" id="nome">
      </p>
      <p>
        <label for="email">E-mail:</label><br>
        <input type="text" id="email">
      </p>
      <p>
        <label for="mensagem">O que aconteceu?</label><br>
        <textarea id="mensagem" rows="5" cols="40"></textarea>
      </p>
      <button type="submit">Enviar</button>
      <p id="sucesso"></p>
    </form>
  </div>

  <div class="rodape">
    <p>Projeto da disciplina de Front-end. As mensagens de exemplo são fictícias.</p>
  </div>

  <script src="../JavaScript/fonte.js"></script>
  <script src="../JavaScript/formulario.js"></script>
</body>
</html>
